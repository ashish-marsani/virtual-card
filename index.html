  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: linear-gradient(135deg, #ffffff 0%, #f8fafc 40%, #f0f9ff 100%);
      --sky-primary: #0284c7;
      --sky-dark: #0369a1;
      --sky-light: #38bdf8;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --border-sky: rgba(2, 132, 199, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f8fafc 50%, #f0f9ff 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px 100px;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Header Controls */
    .top-nav {
      width: 100%;
      max-width: 1050px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-crest {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .nav-title-block {
      display: flex;
      flex-direction: column;
    }

    .nav-name {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-role {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--sky-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
    }

    .btn-sky {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-sky:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid rgba(203, 213, 225, 0.9);
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
    }

    .btn-outline:hover {
      background: #f8fafc;
      border-color: var(--sky-primary);
      transform: translateY(-2px);
    }

    /* Card Stage & Perspective Wrapper */
    .card-stage {
      width: 100%;
      max-width: 1050px;
      height: 600px;
      margin: 10px auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: visible;
    }

    .card-scene {
      width: 1050px;
      height: 600px;
      perspective: 2500px;
      -webkit-perspective: 2500px;
      margin: -300px 0 0 -525px;
      position: absolute;
      top: 50%;
      left: 50%;
      cursor: pointer;
      user-select: none;
      transform-origin: center center;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.34, 1.25, 0.64, 1);
      border-radius: 24px;
    }

    .card-flipper.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-sky);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.95),
                  0 25px 50px -12px rgba(15, 23, 42, 0.08);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      isolation: isolate;
    }

    .card-front {
      transform: rotateY(0deg) translateZ(1px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
      z-index: 2;
    }

    .card-back {
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
      z-index: 1;
    }

    /* Bulletproof visibility switch at 50% midpoint to eliminate mirror ghosting on WebKit/iOS */
    .card-flipper:not(.flipped) .card-front {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.12s ease 0.32s, visibility 0s ease 0.32s;
    }

    .card-flipper:not(.flipped) .card-back {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease 0.25s, visibility 0s ease 0.32s;
    }

    .card-flipper.flipped .card-front {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease 0.25s, visibility 0s ease 0.32s;
    }

    .card-flipper.flipped .card-back {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.12s ease 0.32s, visibility 0s ease 0.32s;
    }

    /* Card Front Layout */
    .front-layout {
      height: 100%;
      padding: 34px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
    }

    .front-layout::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.08) 0%, rgba(2, 132, 199, 0) 70%);
      pointer-events: none;
    }

    .front-layout::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.04) 0%, rgba(15, 23, 42, 0) 70%);
      pointer-events: none;
    }

    .front-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .front-crest {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 19px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(2, 132, 199, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #0369a1;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .top-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0284c7;
      box-shadow: 0 0 6px rgba(2, 132, 199, 0.7);
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 26px;
      position: relative;
      z-index: 2;
    }

    .avatar-wrap {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0284c7 0%, rgba(2, 132, 199, 0.25) 50%, #0369a1 100%);
      box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(2, 132, 199, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #ffffff;
      background: #e2e8f0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .person-name {
      font-family: 'Outfit', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0px;
      line-height: 1.1;
    }

    .person-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--sky-primary);
      letter-spacing: 0.3px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .person-title span.dot {
      color: #64748b;
      font-weight: 500;
    }

    .person-summary {
      font-size: 11.5px;
      line-height: 1.58;
      color: #334155;
      max-width: 760px;
      margin-top: 8px;
      font-weight: 500;
    }

    .person-summary strong {
      color: var(--text-dark);
      font-weight: 700;
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .pillar-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-top: 3px solid #0284c7;
      border-radius: 12px;
      padding: 13px 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .pillar-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pillar-icon-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.18);
    }

    .pillar-title {
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.1px;
    }

    .pillar-desc {
      font-size: 10.5px;
      line-height: 1.45;
      color: #475569;
      font-weight: 500;
    }

    .front-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      padding-top: 10px;
      border-top: 1px solid rgba(226, 232, 240, 0.8);
    }

    .contact-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .contact-item svg {
      width: 15px;
      height: 15px;
      fill: var(--sky-primary);
      flex-shrink: 0;
    }

    .contact-link {
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
    }

    /* Strike-Through Diagonal Signature */
    .signature-container {
      position: relative;
      width: 180px;
      height: 65px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .signature-img {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      height: 68px;
      width: auto;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.08));
    }

    .signature-line {
      width: 100%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(2, 132, 199, 0.5) 25%, #0f172a 50%, rgba(2, 132, 199, 0.5) 75%, transparent);
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .signature-label {
      font-family: 'Outfit', sans-serif;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #475569;
      text-transform: uppercase;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Card Back Layout */
    .back-layout {
      height: 100%;
      padding: 40px 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
    }

    .qr-panel {
      width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border-sky);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-tag {
      font-family: 'Outfit', sans-serif;
      margin-top: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0369a1;
      background: rgba(2, 132, 199, 0.08);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(2, 132, 199, 0.2);
    }

    .qr-sub {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 6px;
      font-weight: 600;
    }

    .back-divider {
      width: 1.5px;
      height: 480px;
      background: linear-gradient(to bottom, transparent, rgba(2, 132, 199, 0.3) 30%, #0f172a 50%, rgba(2, 132, 199, 0.3) 70%, transparent);
      position: relative;
      z-index: 2;
    }

    .back-content {
      flex: 1;
      padding-left: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .back-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-title {
      font-family: 'Outfit', sans-serif;
      font-size: 27px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.4px;
    }

    .back-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--sky-primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .back-caps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .cap-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .cap-bullet {
      width: 8.5px;
      height: 8.5px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
      background: #0284c7;
      box-shadow: 0 0 6px rgba(2, 132, 199, 0.6);
    }

    .cap-text {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .cap-text strong {
      font-family: 'Outfit', sans-serif;
      color: var(--text-dark);
      font-weight: 700;
    }

    .back-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(226, 232, 240, 0.9);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
      fill: var(--sky-primary);
      flex-shrink: 0;
    }



    /* Floating Action Dock */
    .action-dock {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    .dock-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(203, 213, 225, 0.9);
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dock-btn:hover {
      background: #f0f9ff;
      border-color: rgba(2, 132, 199, 0.3);
      transform: translateY(-2px);
    }

    .dock-btn.primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }

    .dock-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }

    .dock-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--sky-light);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* iOS Fullscreen Prompt */
    .ios-prompt {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: white;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 14px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: calc(100% - 32px);
      max-width: 350px;
      text-align: left;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    @keyframes slideUpFade {
      from { transform: translate(-50%, 30px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    
    .ios-prompt-content {
      flex: 1;
      line-height: 1.4;
    }
    
    .ios-prompt-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Floating mobile controls */
    .mobile-controls {
      display: none;
    }

    .in-app-banner {
      display: none;
    }

    /* Responsive scaling & landscape presentation for mobile devices */
    @media (max-width: 1080px) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        justify-content: center !important;
        align-items: center !important;
        height: 100vh !important;
        height: 100dvh !important;
      }
      .top-nav,
      .action-dock {
        display: none !important;
      }
      .card-stage {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        z-index: 10;
      }

      .mobile-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        position: fixed;
        bottom: 22px;
        right: 18px;
        z-index: 100;
      }

      .mobile-rotate-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(2, 132, 199, 0.35);
        color: #0369a1;
        font-family: 'Outfit', sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 8px 14px;
        border-radius: 9999px;
        box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(2, 132, 199, 0.12);
        cursor: pointer;
        user-select: none;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s, box-shadow 0.2s;
      }
      .mobile-rotate-btn:active {
        transform: scale(0.93);
        background: rgba(240, 249, 255, 0.95);
      }
      .mobile-rotate-btn svg {
        transition: transform 0.4s cubic-bezier(0.34, 1.25, 0.64, 1);
      }

      .in-app-banner {
        display: none;
        position: fixed;
        top: 12px;
        left: 14px;
        right: 14px;
        z-index: 9999;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #f8fafc;
        padding: 9px 12px;
        border-radius: 12px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11.5px;
        line-height: 1.4;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.15);
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        animation: fadeInDown 0.4s ease;
      }
      .in-app-banner-content {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .in-app-banner-icon {
        font-size: 15px;
        flex-shrink: 0;
      }
      .in-app-banner-close {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
    }
  </style>
</head>

  <script>
    // State management
    let currentSide = 1; // 1: Front, 2: Back, 3: Actions
    let flipCount = 0;
    
    // We have 3 templates
    const templates = {
      1: 'template-front',
      2: 'template-back',
      3: 'template-actions'
    };

    function initCard() {
      const visibleFace = document.getElementById('visibleFace');
      const hiddenFace = document.getElementById('hiddenFace');
      
      // Inject Side 1 into visible, Side 2 into hidden
      visibleFace.innerHTML = document.getElementById(templates[1]).innerHTML;
      hiddenFace.innerHTML = document.getElementById(templates[2]).innerHTML;
      
      // Init QR code which is now in hiddenFace
      initQRCode();
      checkIosPrompt();
    }

    function initQRCode() {
      const qrContainer = document.getElementById("qrcode");
      if (qrContainer && qrContainer.childElementCount === 0) {
        new QRCode(qrContainer, {
          text: "https://ashishmarsani.com.np",
          width: 172,
          height: 172,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }
    
    function copyText(text, msg, btn) {
      function showToastMsg(message) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        if (toast && toastMsg) {
          toastMsg.textContent = message;
          toast.classList.add('show');
          setTimeout(() => {
            toast.classList.remove('show');
          }, 2400);
        }
      }

      if (btn) {
        const span = btn.querySelector('span');
        if (span && !btn.dataset.originalText) {
          btn.dataset.originalText = span.textContent;
          span.textContent = '✓ Copied!';
          setTimeout(() => {
            span.textContent = btn.dataset.originalText;
            delete btn.dataset.originalText;
          }, 1600);
        }
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToastMsg(msg);
        }).catch(err => {
          fallbackCopyText(text, msg, showToastMsg);
        });
      } else {
        fallbackCopyText(text, msg, showToastMsg);
      }
    }

    function fallbackCopyText(text, msg, showToastMsg) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToastMsg(msg);
      } catch (err) {
        console.error('Fallback: Oops, unable to copy', err);
      }
      document.body.removeChild(textArea);
    }

    function checkIosPrompt() {
      const iosActionPrompt = document.getElementById('iosActionPrompt');
      if (iosActionPrompt) {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isIOS && !isStandalone) {
          iosActionPrompt.style.display = 'block';
        }
      }
    }

    // Flip logic with 3-state content swapping
    function flipCard() {
      const flipper = document.getElementById('flipper');
      const visibleFace = document.getElementById('visibleFace');
      const hiddenFace = document.getElementById('hiddenFace');
      
      if (!flipper || !visibleFace || !hiddenFace) return;
      
      // Haptic feedback on supported mobile devices
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      flipCount++;
      const currentRotation = flipCount * 180;
      
      // Rotate the entire flipper
      flipper.style.transform = `rotateY(${currentRotation}deg)`;
      flipper.style.webkitTransform = `rotateY(${currentRotation}deg)`;
      
      // Determine max sides based on viewport
      const maxSides = (window.innerWidth <= 1080) ? 3 : 2;
      
      // Update state
      currentSide = (currentSide >= maxSides) ? 1 : currentSide + 1;
      const nextHiddenSide = (currentSide >= maxSides) ? 1 : currentSide + 1;
      
      // When the card is exactly edge-on (invisible), swap the hidden face's content
      // The CSS transition is 0.65s, so edge-on is at ~0.325s (325ms)
      setTimeout(() => {
        if (flipCount % 2 !== 0) {
          // hiddenFace becomes visible. We swap visibleFace's content for the next state.
          visibleFace.innerHTML = document.getElementById(templates[nextHiddenSide]).innerHTML;
        } else {
          // visibleFace becomes visible. We swap hiddenFace's content for the next state.
          hiddenFace.innerHTML = document.getElementById(templates[nextHiddenSide]).innerHTML;
        }
        
        // Re-init specific dynamic components if needed
        initQRCode();
        checkIosPrompt();
        
      }, 325);
      
      // Attempt to enter fullscreen on mobile devices when tapping the card (Android Chrome supports this)
      if (window.innerWidth <= 1080 && /Mobi|Android/i.test(navigator.userAgent)) {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(err => {});
        }
      }
    }

    // Global Toast Notification Helper
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (toast && toastMsg) {
        toastMsg.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }
    }

    // In-app browser detection (Messenger, Instagram, etc.)
    function checkInAppBrowser() {
      const isInApp = /FBAN|FBAV|Instagram|Line|Twitter|MicroMessenger|Snapchat|LinkedIn/i.test(navigator.userAgent);
      if (isInApp && !sessionStorage.getItem('inAppNoticeDismissed')) {
        const banner = document.getElementById('inAppBanner');
        if (banner) banner.style.display = 'flex';
      }
    }

    function dismissInAppBanner() {
      const banner = document.getElementById('inAppBanner');
      if (banner) banner.style.display = 'none';
      sessionStorage.setItem('inAppNoticeDismissed', 'true');
    }

    // Manual rotation state for mobile: 90 (left), -90 (right), 0 (horizontal)
    let currentManualAngle = 90;

    function rotateCardManual(event) {
      if (event) event.stopPropagation();

      // Cycle: 90° (Landscape-Left) -> -90° (Landscape-Right) -> 0° (Horizontal) -> 90°
      if (currentManualAngle === 90) {
        currentManualAngle = -90;
        showToast('Rotated (Landscape-Right)');
      } else if (currentManualAngle === -90) {
        currentManualAngle = 0;
        showToast('Rotated (Horizontal View)');
      } else {
        currentManualAngle = 90;
        showToast('Rotated (Landscape-Left)');
      }

      // Rotate icon feedback
      const btn = document.querySelector('.mobile-rotate-btn');
      if (btn) {
        const svg = btn.querySelector('svg');
        if (svg) {
          svg.style.transform = `rotate(${currentManualAngle === 0 ? 0 : currentManualAngle}deg)`;
        }
      }

      updateCardScale();
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', initCard);

    // Dynamic responsive card scaling and landscape orientation
    function updateCardScale() {
      const stage = document.getElementById('cardStage');
      const scene = document.getElementById('cardScene');
      if (!stage || !scene) return;

      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      if (viewportWidth > 1080) {
        // Desktop mode - normal layout
        stage.style.width = '1050px';
        stage.style.height = '600px';
        scene.style.transform = 'scale(1)';
        return;
      }

      // Mobile Mode (<= 1080px) — card is fixed vertically at viewport center
      stage.style.width = viewportWidth + 'px';
      stage.style.height = viewportHeight + 'px';

      // Device physical orientation angle
      let orientAngle = 0;
      if (typeof window.orientation !== 'undefined' && window.orientation !== null) {
        orientAngle = Number(window.orientation);
      } else if (screen.orientation && typeof screen.orientation.angle !== 'undefined') {
        orientAngle = Number(screen.orientation.angle);
      }

      // Check if browser viewport has rotated into landscape (width > height)
      const isViewportLandscape = (viewportWidth > viewportHeight) || (window.matchMedia && window.matchMedia('(orientation: landscape)').matches);

      if (isViewportLandscape) {
        // Browser viewport has rotated into landscape (both landscape-left and landscape-right)
        const scaleW = viewportWidth / 1050;
        const scaleH = viewportHeight / 600;
        const scale = Math.min(scaleW, scaleH) * 0.92;
        scene.style.transform = `scale(${scale})`;
      } else {
        // Browser viewport is in portrait (viewportHeight >= viewportWidth)
        let angle = currentManualAngle;

        // Auto-adopt physical landscape angle if reported by system
        if (orientAngle === -90 || orientAngle === 270 || (screen.orientation && screen.orientation.type === 'landscape-secondary')) {
          angle = -90;
        } else if (orientAngle === 90 || (screen.orientation && screen.orientation.type === 'landscape-primary')) {
          angle = 90;
        }

        let scaleW, scaleH;
        if (angle === 0) {
          scaleW = viewportWidth / 1050;
          scaleH = viewportHeight / 600;
        } else {
          scaleW = viewportWidth / 600;
          scaleH = viewportHeight / 1050;
        }

        const scale = Math.min(scaleW, scaleH) * 0.92;
        if (angle === 0) {
          scene.style.transform = `scale(${scale})`;
        } else {
          scene.style.transform = `rotate(${angle}deg) scale(${scale})`;
        }
      }
    }

    // Staggered retries after orientation change to handle iOS viewport settle delay
    function handleOrientationChange() {
      updateCardScale();
      setTimeout(updateCardScale, 80);
      setTimeout(updateCardScale, 200);
      setTimeout(updateCardScale, 450);
      setTimeout(updateCardScale, 800);
    }

    // Listen to all orientation signals for maximum coverage
    window.addEventListener('resize', updateCardScale);
    window.addEventListener('orientationchange', handleOrientationChange);

    // Modern screen.orientation API
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', handleOrientationChange);
    }

    // MediaQuery listener (compatible with addEventListener and legacy addListener)
    try {
      const landscapeMQ = window.matchMedia('(orientation: landscape)');
      if (landscapeMQ.addEventListener) {
        landscapeMQ.addEventListener('change', handleOrientationChange);
      } else if (landscapeMQ.addListener) {
        landscapeMQ.addListener(handleOrientationChange);
      }
    } catch (e) {}

    document.addEventListener('DOMContentLoaded', () => {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      const iosPrompt = document.getElementById('iosPrompt');
      if (isIOS && !isStandalone && iosPrompt) {
        iosPrompt.style.display = 'flex';
      }
      
      checkInAppBrowser();
      updateCardScale();
    });
    setTimeout(updateCardScale, 200);

    // Keyboard support: Space or Enter flips
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
        flipCard();
      }
    });

    // Toast notification

  </script>
